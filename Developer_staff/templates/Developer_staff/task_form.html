{% extends 'Developer_staff/base_developer.html' %}

{% block title %}{% if task %}Edit Task{% else %}Create Task{% endif %}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800">
        {% if task %}
            Edit Task: {{ task.title }}
        {% else %}
            Create a New Task
        {% endif %}
    </h1>

    <form method="POST" class="mt-8 bg-white p-8 rounded-lg shadow-sm space-y-6">
        {% csrf_token %}
        
        <!-- This renders all form fields as paragraphs. A good starting point. -->
        {{ form.as_p }}

        <div class="pt-4 flex justify-end space-x-3">
            <a href="{% url 'Developer_staff:task_management' %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">
                Cancel
            </a>
            <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                Save Task
            </button>
        </div>
    </form>
</div>
{% endblock %}
