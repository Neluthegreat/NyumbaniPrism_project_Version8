{% extends 'HoD_Maintenance/base.html' %}

{% block title %}Inventory Requisitions{% endblock %}

{% block content %}

<!-- Requisitions Dashboard -->
<div id="inventory-requisitions-dashboard">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-4xl font-bold text-gray-800">Inventory Requisitions</h1>
        <!-- Added an ID to this button -->
        <button id="new-requisition-btn" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-indigo-700 flex items-center">
            <span class="material-icons-outlined mr-2">add</span>New Requisition
        </button>
    </div>
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <!-- Table content remains the same -->
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Requisition ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Requested By</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr class="requisition-row-clickable hover:bg-gray-50 cursor-pointer">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-indigo-600">REQ-00451</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Charlie Brown</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Pending</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Hidden detail view remains the same -->
<div id="requisition-detail-view" class="hidden">
    <!-- ... detail view content ... -->
</div>


<!-- ======================= POPUP MODAL for New Requisition ======================= -->
<div id="new-requisition-popup" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl p-6 max-h-full overflow-y-auto">
        <div class="flex justify-between items-center mb-6 border-b pb-3">
            <h2 class="text-2xl font-bold text-gray-800">New Inventory Requisition</h2>
            <button id="close-requisition-popup" class="text-gray-400 hover:text-gray-600">
                <span class="material-icons-outlined">close</span>
            </button>
        </div>
        <form>
            <div class="space-y-4">
                <div>
                    <label for="req-requester-name" class="block text-sm font-medium text-gray-700">Your Name</label>
                    <input type="text" id="req-requester-name" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
                </div>
                <div>
                    <label for="req-justification" class="block text-sm font-medium text-gray-700">Justification / Reason for Request</label>
                    <textarea id="req-justification" rows="3" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"></textarea>
                </div>
                <div>
                    <h3 class="text-lg font-medium text-gray-800 border-b pb-2 mb-2">Requested Items</h3>
                    <div class="space-y-2">
                         <!-- In a real app, you would dynamically add more rows here -->
                        <div class="grid grid-cols-3 gap-4 items-center">
                            <input type="text" placeholder="Item Name (e.g., Wireless Keyboard)" class="col-span-2 border-gray-300 rounded-md shadow-sm">
                            <input type="number" placeholder="Qty" value="1" class="border-gray-300 rounded-md shadow-sm">
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-4 mt-8 pt-4 border-t">
                <button type="button" id="cancel-requisition-creation" class="bg-white text-gray-700 border border-gray-300 font-semibold py-2 px-4 rounded-lg shadow-sm hover:bg-gray-50">Cancel</button>
                <button type="submit" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-indigo-700">Submit Request</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
