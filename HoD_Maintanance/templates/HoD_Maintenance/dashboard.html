{% extends 'HoD_Maintenance/base.html' %}

{% block title %}Maintenance Dashboard{% endblock %}

{% block content %}
<div id="maintenance-dashboard">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-4xl font-bold text-gray-800">Maintenance Dashboard</h1>
        <button class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-indigo-700 flex items-center">
            <span class="material-icons-outlined mr-2">add</span>
            New Maintenance Task
        </button>
    </div>
    
    <div class="p-6 bg-white rounded-lg shadow-md">
        <p>This is the main content area for the maintenance dashboard. You can add your tables, charts, and other components here.</p>
    </div>
</div>
{% endblock %}
