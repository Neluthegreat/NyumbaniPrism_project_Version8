{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- The title can be dynamic using a block -->
    <title>{% block title %}PRISM - Management{% endblock %}</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- You can link to a custom CSS file here if needed -->
    <!-- <link rel="stylesheet" href="{% static 'css/custom.css' %}"> -->
    <style type="text/tailwindcss">
        :root {
            --primary-50: #eff6ff;
            --primary-100: #dbeafe;
            --primary-500: #3b82f6;
            --primary-600: #2563eb;
            --neutral-50: #f8fafc;
            --neutral-100: #f1f5f9;
            --neutral-200: #e2e8f0;
            --neutral-300: #cbd5e1;
            --neutral-400: #94a3b8;
            --neutral-600: #475569;
            --neutral-700: #334155;
            --neutral-800: #1e293b;
            --neutral-900: #0f172a;
            --accent-orange: #f97316;
            --accent-blue: #3b82f6;
            --accent-green: #16a34a;
            --accent-purple: #9333ea;
            --accent-pink: #ec4899;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        .sidebar {
            transition: width 0.3s ease-in-out;
        }
        .sidebar:not(:hover) {
            width: 80px;
        }
        .sidebar:not(:hover) .sidebar-text,
        .sidebar:not(:hover) .submenu,
        .sidebar:not(:hover) .chevron {
            display: none;
        }
        .submenu-item.active {
            color: var(--primary-600);
            font-weight: 500;
            background-color: var(--primary-50);
        }
    </style>
</head>
<body class="bg-[var(--neutral-50)]">
    <div class="flex h-screen">
        <!-- Sidebar Navigation -->
        <nav class="sidebar fixed top-0 left-0 h-full w-64 bg-white shadow-lg overflow-y-auto overflow-x-hidden group">
            <div class="flex flex-col justify-between h-full p-4">
                <div>
                    <div class="flex items-center gap-3 mb-6 px-2 py-2">
                        <svg class="h-8 w-8 text-[var(--primary-500)]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <span class="sidebar-text text-xl font-bold text-[var(--neutral-800)]">PRISM</span>
                    </div>
                    <ul class="space-y-1">
                        <!-- Use Django's url template tag for navigation -->
                        <li>
                            <a href="#" class="submenu-item flex items-center gap-3 px-3 py-2.5 rounded-md text-[var(--neutral-700)] hover:bg-[var(--neutral-100)] hover:text-[var(--neutral-900)] text-sm">
                                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2.25 12l8.954-8.955a1.125 1.125 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                <span class="sidebar-text">Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <details class="group/details" open>
                                <summary class="flex items-center justify-between gap-3 px-3 py-2.5 rounded-md cursor-pointer text-[var(--neutral-700)] hover:bg-[var(--neutral-100)] hover:text-[var(--neutral-900)] text-sm">
                                    <div class="flex items-center gap-3">
                                        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25-2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                        <span class="sidebar-text">Service Management</span>
                                    </div>
                                    <svg class="h-4 w-4 chevron transition-transform group-open/details:rotate-90" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path clip-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" fill-rule="evenodd"></path></svg>
                                </summary>
                                <ul class="submenu pl-8 mt-1 space-y-1 text-sm">
                                    <li><a href="#" class="block px-3 py-2 rounded-md text-[var(--neutral-600)] hover:bg-[var(--neutral-100)] hover:text-[var(--neutral-900)] submenu-item">Project Management</a></li>
                                    <li><a href="#" class="block px-3 py-2 rounded-md text-[var(--neutral-600)] hover:bg-[var(--neutral-100)] hover:text-[var(--neutral-900)] submenu-item">Task Tracking</a></li>
                                </ul>
                            </details>
                        </li>
                        <!-- Add other sidebar items here -->
                    </ul>
                </div>
                <div>
                    <a class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[var(--neutral-700)] hover:bg-[var(--neutral-100)] hover:text-[var(--neutral-900)] text-sm" href="#">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.594 3.94c.09-.542.56-1.007 1.11-1.11h2.593c.55-.103 1.02.367 1.11 1.11l.09 5.586c.395.201.755.452 1.08.734l4.242-2.357c.465-.258 1.023-.042 1.258.411l1.496 2.593c.234.453.018 1.018-.412 1.258l-4.242 2.357c-.044.205-.083.414-.116.627l2.358 4.242c.258.465.042 1.023-.411 1.258l-2.593 1.496c-.453.234-1.018.018-1.258-.412l-2.357-4.242a8.043 8.043 0 01-1.08-.734l-5.586.09c-.542.09-1.007-.56-1.11-1.11V9.594c.103-.55.367-1.02.918-1.11l5.586-.09a8.043 8.043 0 01.734-1.08L5.19 5.587c-.465-.258-.68-.816-.412-1.258l1.496-2.593C6.51.27 7.076.063 7.54 3.22l4.242 2.357c.205.044.414.083.627.116L12.447.83z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        <span class="sidebar-text">System Settings</span>
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="ml-20 flex-1 overflow-y-auto p-8 transition-all duration-300 ease-in-out group-hover:ml-64">
            <!-- The content from other templates will be injected here -->
            {% block content %}
            {% endblock content %}
        </main>
    </div>

    <!-- Details Sliding Panel (can be kept in base.html as it's a global element) -->
    <div class="fixed inset-0 bg-black bg-opacity-30 z-40 hidden" id="detail-overlay"></div>
    <div class="fixed top-0 right-0 h-full w-full max-w-lg bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50 overflow-y-auto" id="detail-panel">
        <!-- Panel content will be loaded dynamically by JS -->
    </div>
    
    <!-- Proforma Modal (also a global element) -->
    <div id="proforma-modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden"></div>
    <div id="proforma-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-lg shadow-2xl z-50 w-full max-w-2xl hidden">
        <!-- Modal content from original file goes here -->
    </div>

    <!-- Your original script tag -->
    <!-- NOTE: For a multi-page Django app, this large script block should be broken down into smaller, page-specific JS files -->
    <script>
        // The entire script from your original file would go here.
        // It's recommended to move this to a static JS file, e.g., {% static 'js/main.js' %}
    </script>
</body>
</html>
