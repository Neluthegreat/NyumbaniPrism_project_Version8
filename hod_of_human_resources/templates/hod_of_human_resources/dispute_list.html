{% extends "hod_of_human_resources/base.html" %}

{% block content %}
<div class="container">
    <h2>Disputes</h2>
    <a href="{% url 'hod_of_human_resources:dispute_create' %}" class="btn btn-primary mb-3">Create New Dispute</a>
    <table class="table">
        <thead>
            <tr>
                <th>Employee</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for dispute in disputes %}
            <tr>
                <td>{{ dispute.employee.full_name }}</td>
                <td>{{ dispute.description }}</td>
                <td>{{ dispute.status }}</td>
                <td>
                    <a href="{% url 'hod_of_human_resources:dispute_update' dispute.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'hod_of_human_resources:dispute_delete' dispute.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
