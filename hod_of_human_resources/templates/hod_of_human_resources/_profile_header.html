<header class="sticky top-0 bg-white shadow-sm p-4 flex justify-between items-center z-40">
    <!-- Left side: Page Title -->
    <div class="flex items-center">
        <h1 class="text-xl font-semibold text-gray-800">{% block page_title %}Dashboard{% endblock %}</h1>
    </div>

    <!-- Center: Search Bar -->
    <div class="flex-1 max-w-md mx-4">
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                </svg>
            </span>
            <input type="text" placeholder="Search..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>
    </div>

    <!-- Right side: Actions & Profile -->
    <div class="flex items-center space-x-6">
        <!-- Action Buttons -->
        <button class="text-gray-500 hover:text-gray-700 relative" title="Notifications">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
            </svg>
            <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"></span>
        </button>
        <button class="text-gray-500 hover:text-gray-700" title="Settings">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-1.007 1.11-1.226a2.25 2.25 0 012.58 1.226c.09.542.56 1.007 1.11 1.226a2.25 2.25 0 012.58 1.226c.09.542.56 1.007 1.11 1.226a2.25 2.25 0 012.58 1.226c.09.542.56 1.007 1.11 1.226a2.25 2.25 0 012.58 1.226c.09.542.56 1.007 1.11 1.226a2.25 2.25 0 01-2.58 1.226c-.09-.542-.56-1.007-1.11-1.226a2.25 2.25 0 01-2.58-1.226c-.09-.542-.56-1.007-1.11-1.226a2.25 2.25 0 01-2.58-1.226c-.09-.542-.56-1.007-1.11-1.226a2.25 2.25 0 01-2.58-1.226c-.09-.542-.56-1.007-1.11-1.226a2.25 2.25 0 012.58-1.226z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

        <!-- Profile Dropdown -->
        <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center space-x-2">
                <div class="relative">
                    {% if user.profile.profile_picture %}
                        <img src="{{ user.profile.profile_picture.url }}" alt="Profile" class="w-10 h-10 rounded-full">
                    {% else %}
                        <span class="inline-flex items-center justify-center h-10 w-10 rounded-full bg-gray-500">
                            <span class="font-medium leading-none text-white">{{ user.username|slice:":1"|upper }}</span>
                        </span>
                    {% endif %}
                    <span class="absolute bottom-0 right-0 block h-2.5 w-2.5 rounded-full bg-green-400 ring-2 ring-white"></span>
                </div>
                <div class="text-left hidden sm:block">
                    <p class="font-semibold text-sm text-gray-700">{{ user.get_full_name|default:user.username }}</p>
                    <p class="text-xs text-gray-500">Head of Human Resources</p>
                </div>
                <svg class="w-5 h-5 text-gray-500 hidden sm:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
            <div x-show="open" @click.away="open = false" class="absolute right-0 mt-2 w-56 bg-white rounded-md shadow-lg py-1 z-50" x-cloak>
                <div class="px-4 py-2 border-b border-gray-100">
                    <p class="text-sm font-semibold text-gray-800">{{ user.get_full_name|default:user.username }}</p>
                    <p class="text-xs text-gray-500">{{ user.email }}</p>
                </div>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">My Profile</a>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Help Center</a>
                <div class="border-t border-gray-100"></div>
                <a href="{% url 'accounts:logout' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
            </div>
        </div>
    </div>
</header>
