{% extends "hod_of_human_resources/base.html" %}

{% block content %}
<div class="container">
    <h2>Confirm Deletion</h2>
    <p>Are you sure you want to delete the succession plan for "{{ plan.position }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'hod_of_human_resources:succession_plan_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
