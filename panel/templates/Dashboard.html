<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>PRISM - Dashboard</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style type="text/tailwindcss">
        :root {
            --primary-color: #0c77f2;
            --primary-hover-color: #0a63ce;
            --background-color: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-active: #ffffff;
            --border-color: #e2e8f0;
            --sidebar-bg: #ffffff;
        }
        .sidebar {
            transition: width 0.3s ease-in-out;
        }
        .sidebar-collapsed {
            width: 5.5rem;
        }
        .sidebar-expanded {
            width: 18rem;
        }
        .sidebar.sidebar-collapsed:not(:hover) .sidebar-text,
        .sidebar.sidebar-collapsed:not(:hover) .dropdown-icon {
            opacity: 0;
            width: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, width 0.2s ease, visibility 0.2s ease;
        }
        .sidebar .sidebar-text,
        .sidebar .dropdown-icon {
            opacity: 1;
            width: auto;
            visibility: visible;
            transition: opacity 0.3s 0.1s ease, width 0.2s 0.1s ease, visibility 0.2s 0.1s ease;
        }
        /* Style for the currently active sidebar item */
        .sidebar-item-active {
            background-color: var(--primary-color);
            color: var(--text-active);
        }
        .sidebar-item-active svg {
            color: var(--text-active);
        }
        .sidebar-item:hover {
            background-color: var(--primary-color);
            color: var(--text-active);
        }
        .sidebar-item:hover svg {
            color: var(--text-active);
        }
        .card-icon {
            font-size: 3rem;
            color: var(--primary-color);
        }
        .card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .card-link {
            text-decoration: none;
            color: inherit;
        }
        .card-link:hover .card-title, .card-link:hover .card-text {
            color: var(--primary-hover-color);
        }
    </style>
</head>
<body class="bg-[var(--background-color)]" style="font-family: 'Inter', sans-serif;">
    <div class="relative flex min-h-screen" x-data="{ isSidebarExpanded: true }">
        <aside :class="isSidebarExpanded ? 'sidebar-expanded' : 'sidebar-collapsed'" @mouseenter="isSidebarExpanded = true" @mouseleave="isSidebarExpanded = false" class="sidebar flex flex-col bg-[var(--sidebar-bg)] shadow-lg fixed top-0 left-0 h-full overflow-hidden z-10">
            <div class="flex items-center gap-4 p-6 border-b border-[var(--border-color)] flex-shrink-0">
                <svg class="text-[var(--primary-color)] w-8 h-8 flex-shrink-0" fill="currentColor" height="32" viewBox="0 0 256 256" width="32" xmlns="http://www.w3.org/2000/svg"><path d="M208.68,52.23,141.22,12.06a24,24,0,0,0-26.44,0L47.32,52.23a24,24,0,0,0-15,21.91V181.86a24,24,0,0,0,15,21.91l67.46,40.17a24,24,0,0,0,26.44,0l67.46-40.17a24,24,0,0,0,15-21.91V74.14A24,24,0,0,0,208.68,52.23Z" opacity="0.2"></path><path d="M212.09,47.8,144.62,8.62a23.93,23.93,0,0,0-33.24,0L43.91,47.8a24,24,0,0,0-11.9,20.73V187.47a24,24,0,0,0,11.9,20.73l67.47,39.18a23.93,23.93,0,0,0,33.24,0l67.47-39.18a24,24,0,0,0,11.9-20.73V68.53A24,24,0,0,0,212.09,47.8ZM128,24,192.2,62.13,128,100.25,63.8,62.13Zm-88,54.53L128,124.75v78.51L56.7,163.64ZM144,203.26V124.75l88-46.22v98.73Z"></path></svg>
                <span class="sidebar-text text-xl font-bold text-[var(--text-primary)] whitespace-nowrap">PRISM</span>
            </div>
            <!-- UPDATED & SIMPLIFIED NAVIGATION -->
            <nav class="flex-grow p-4 space-y-2">
                <a class="sidebar-item-active flex items-center gap-4 px-4 py-2.5 rounded-md" href="{% url 'panel:panel_dashboard' %}">
                    <svg class="w-6 h-6 flex-shrink-0" fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0,1.14,1.14,0,0,0,.11.11l80,75.48A16,16,0,0,1,224,115.55Z"></path></svg>
                    <span class="sidebar-text font-medium whitespace-nowrap">Dashboard</span>
                </a>
                <a class="sidebar-item flex items-center gap-4 px-4 py-2.5 rounded-md text-[var(--text-secondary)]" href="{% url 'panel:system-settings' %}">
                    <svg class="w-6 h-6 flex-shrink-0 text-[var(--text-secondary)]" fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M216,112a8,8,0,0,1-8,8H179.32l28.82,28.82a8,8,0,0,1-11.32,11.32L168,131.32V160a8,8,0,0,1-16,0V131.32L123.18,159.14a8,8,0,0,1-11.32-11.32L140.68,120H112a8,8,0,0,1,0-16h28.68L111.86,65.18a8,8,0,0,1,11.32-11.32L152,82.68V56a8,8,0,0,1,16,0v26.68l28.82-28.82a8,8,0,0,1,11.32,11.32L179.32,96H208A8,8,0,0,1,216,112Zm-78.63,94.63a8,8,0,0,0-11.31,0L32.85,249.85a8,8,0,0,0,5.66,13.66h.34A8,8,0,0,0,44.5,261l93.22-93.23a8,8,0,0,0,0-11.31ZM96,152a56,56,0,1,0-56-56A56.06,56.06,0,0,0,96,152Zm0-96a40,40,0,1,1-40,40A40.05,40.05,0,0,1,96,56Z"></path></svg>
                    <span class="sidebar-text font-medium whitespace-nowrap">System Settings</span>
                </a>
                <a class="sidebar-item flex items-center gap-4 px-4 py-2.5 rounded-md text-[var(--text-secondary)]" href="{% url 'panel:customer-management' %}">
                    <svg class="w-6 h-6 flex-shrink-0" fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M117.25,157.92a60,60,0,1,0-66.5,0A95.83,95.83,0,0,0,3.53,195.63a8,8,0,1,0,13.4,8.74,80,80,0,0,1,134.14,0,8,8,0,0,0,13.4-8.74A95.83,95.83,0,0,0,117.25,157.92ZM40,108a44,44,0,1,1,44,44A44.05,44.05,0,0,1,40,108Zm210.14,98.7a8,8,0,0,1-11.07-2.33A79.83,79.83,0,0,0,172,168a8,8,0,0,1,0-16,44,44,0,1,0-16.34-84.87,8,8,0,1,1-5.94-14.85,60,60,0,0,1,55.53,105.64,95.83,95.83,0,0,1,47.22,37.71A8,8,0,0,1,250.14,206.7Z"></path></svg>
                    <span class="sidebar-text font-medium whitespace-nowrap">Customer Management</span>
                </a>
            </nav>
        </aside>

        <main :class="isSidebarExpanded ? 'ml-72' : 'ml-[88px]'" class="flex-1 transition-all duration-300 p-4 lg:p-8 bg-gray-100">
            <div class="container-fluid">
                <!-- Page Title -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">PRISM Dashboard</h1>
                </div>
                <p class="lead mb-4">Welcome! Please select a module to continue.</p>

                <!-- UPDATED & SIMPLIFIED NAVIGATION CARDS -->
                <div class="row g-4">
                    <div class="col-md-6">
                        <a href="{% url 'panel:customer-management' %}" class="card-link">
                            <div class="card h-100">
                                <div class="card-body text-center p-5">
                                    <i class="fas fa-users card-icon mb-3"></i>
                                    <h3 class="card-title">Customer Management</h3>
                                    <p class="card-text text-muted">View, add, edit, and manage all customer accounts and details.</p>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="{% url 'panel:system-settings' %}" class="card-link">
                            <div class="card h-100">
                                <div class="card-body text-center p-5">
                                    <i class="fas fa-cogs card-icon mb-3"></i>
                                    <h3 class="card-title">System Settings</h3>
                                    <p class="card-text text-muted">Configure users, roles, modules, and system security settings.</p>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

            </div>
        </main>
    </div>
    
    <!-- AlpineJS -->
    <script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- REMOVED Chart.js script as it's no longer needed -->
</body>
</html>
