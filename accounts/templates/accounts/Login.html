<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PRISM Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0c77f2;
            --primary-hover-color: #0a63ce;
            --background-color: #f0f4f8;
            --card-bg-color: #ffffff;
            --text-color: #334155;
            --input-border-color: #cbd5e1;
            --input-focus-border-color: #0c77f2;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-in-out;
        }

        .login-branding {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover-color));
            color: white;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .login-branding .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .login-form-container {
            padding: 3rem;
        }
        
        .form-control {
            border-radius: 0.5rem;
            border-color: var(--input-border-color);
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(12, 119, 242, 0.25);
            border-color: var(--input-focus-border-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover-color);
        }
        
        .input-group-text {
            border-radius: 0.5rem 0 0 0.5rem;
            background-color: #f8fafc;
        }

        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .forgot-password-link {
            font-size: 0.9rem;
            color: var(--primary-color);
            text-decoration: none;
        }

        .forgot-password-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container login-container">
        <div class="col-lg-10 col-xl-9 mx-auto">
            <div class="card login-card">
                <div class="row g-0">
                    
                    <!-- Branding Column -->
                    <div class="col-md-5 d-none d-md-flex login-branding">
                        <div>
                            <div class="logo">
                                <i class="fa-solid fa-gem"></i>
                            </div>
                            <h2 class="fw-bold">Welcome to PRISM</h2>
                            <p class="mt-3">Your integrated solution for streamlined operations and data-driven decisions.</p>
                        </div>
                    </div>

                    <!-- Form Column -->
                    <div class="col-md-7">
                        <div class="login-form-container">
                            <div class="text-center mb-4">
                                <h3 class="fw-bold" style="color: var(--text-color);">System Login</h3>
                                <p class="text-muted">Access your dashboard</p>
                            </div>
                            
                            {% if messages %}
                                <div class="alert alert-danger">
                                    {% for message in messages %}
                                        <p>{{ message }}</p>
                                    {% endfor %}
                                </div>
                            {% endif %}
                            <form method="POST" action="{% url 'accounts:login' %}">
                                {% csrf_token %}
                                {% if request.GET.next %}
                                <input type="hidden" name="next" value="{{ request.GET.next }}">
                                {% endif %}
                                <!-- Username Input -->
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username or Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                                    </div>
                                </div>
                                
                                <!-- Password Input -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                                    </div>
                                </div>
                                
                                <!-- Remember Me & Forgot Password -->
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="rememberMe" name="remember_me">
                                        <label class="form-check-label" for="rememberMe">
                                            Remember Me
                                        </label>
                                    </div>
                                    <a href="#" class="forgot-password-link">Forgot Password?</a>
                                </div>
                                
                                <!-- Submit Button -->
                                <div class="d-grid">
                                    <button class="btn btn-primary fw-bold" type="submit">Sign In</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <!-- CSRF Token Handling -->
    <script>
        // Get CSRF token from cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        // Refresh CSRF token by making a GET request
        function refreshCSRFToken() {
            fetch(window.location.href, {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            }).then(() => {
                const newToken = getCookie('csrftoken');
                if (newToken) {
                    const csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
                    if (csrfInput) {
                        csrfInput.value = newToken;
                        console.log('CSRF token refreshed:', newToken.substring(0, 10) + '...');
                    }
                }
            }).catch(error => {
                console.error('Error refreshing CSRF token:', error);
            });
        }
        
        // Ensure CSRF token is properly set and synchronized
        document.addEventListener('DOMContentLoaded', function() {
            const csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
            const csrfToken = getCookie('csrftoken');
            
            if (csrfInput && csrfToken) {
                csrfInput.value = csrfToken;
                console.log('CSRF token synchronized:', csrfToken.substring(0, 10) + '...');
            } else {
                console.warn('CSRF token not found, refreshing...');
                refreshCSRFToken();
            }
            
            // Refresh token every 10 minutes to prevent expiration
            setInterval(refreshCSRFToken, 600000);
            
            // Also refresh token before form submission to ensure it's current
            document.querySelector('form').addEventListener('submit', function(e) {
                const currentToken = getCookie('csrftoken');
                if (currentToken && csrfInput) {
                    csrfInput.value = currentToken;
                    console.log('CSRF token updated before submission:', currentToken.substring(0, 10) + '...');
                }
            });
        });
    </script>
</body>
</html>
